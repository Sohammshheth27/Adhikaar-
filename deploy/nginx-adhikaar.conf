# Serves the static site AND reverse-proxies the API on the same origin (no CORS / mixed-content).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/Adhikaar/frontend;
    index "Scanner.dc.html";

    # Static site (the .dc.html pages + JS)
    location / {
        try_files $uri $uri/ =404;
    }

    # Engine API -> uvicorn on localhost. Long read timeout: a crawl can take up to ~150s.
    location ~ ^/(assess|scan|catalog|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 5m;
}
